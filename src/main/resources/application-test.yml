spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

bot:
  enabled: false
  token: test_token
  username: test_bot
  webhook-url: http://test.com

encryption:
  secret-key: "0123456789abcdef0123456789abcdef"

rate-limiting:
  capacity: 100
  refill-per-minute: 100
