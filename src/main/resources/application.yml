spring:
  application:
    name: taskbot

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/taskbot}
    username: ${POSTGRES_USER:taskbot}
    password: ${POSTGRES_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 600000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        default_batch_fetch_size: 16

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: UTC

server:
  port: 8080
  servlet:
    context-path: /

  tomcat:
    threads:
      max: 50
      min-spare: 5
    max-connections: 100
    connection-timeout: 5000

logging:
  level:
    root: INFO
    com.taskbot: DEBUG
    org.springframework: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %highlight(%-5level) %cyan(%logger{36}) - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/taskbot.log
    max-size: 10MB
    max-history: 7

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

bot:
  token: ${BOT_TOKEN}
  username: ${BOT_USERNAME}
  webhook-url: ${BOT_WEBHOOK_URL}

encryption:
  secret-key: ${ENCRYPTION_SECRET_KEY}

rate-limiting:
  capacity: ${RATE_LIMIT_CAPACITY:30}
  refill-per-minute: ${RATE_LIMIT_REFILL_PER_MINUTE:20}

admin:
  telegram-ids: ${ADMIN_TELEGRAM_IDS:}
